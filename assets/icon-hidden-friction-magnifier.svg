<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-labelledby="title desc">
  <title id="title">Identify hidden friction magnifier icon</title>
  <desc id="desc">Magnifying glass over connected friction points in Beacon and Sage colors.</desc>
  <defs>
    <radialGradient id="bg" cx="34%" cy="26%" r="72%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="62%" stop-color="#F4FAFE"/>
      <stop offset="100%" stop-color="#EAF4FB"/>
    </radialGradient>
    <linearGradient id="goldStroke" x1="20" y1="18" x2="78" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F0C56A"/>
      <stop offset="100%" stop-color="#D9A13A"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#071F4F" flood-opacity="0.12"/>
    </filter>
  </defs>

  <circle cx="48" cy="48" r="40" fill="url(#bg)" filter="url(#softShadow)"/>
  <circle cx="48" cy="48" r="39" fill="none" stroke="#9DB7D4" stroke-width="1.6"/>
  <path d="M20 72C31 82 47 86 62 80" fill="none" stroke="url(#goldStroke)" stroke-width="2.4" stroke-linecap="round" opacity=".9"/>

  <circle cx="42" cy="42" r="18" fill="none" stroke="#071F4F" stroke-width="3.2"/>
  <path d="M55.3 55.3 72.2 72.2" fill="none" stroke="#071F4F" stroke-width="4" stroke-linecap="round"/>
  <circle cx="34.5" cy="36" r="4" fill="#fff" stroke="#0B5EA8" stroke-width="2.4"/>
  <circle cx="48" cy="35.5" r="4" fill="#fff" stroke="#0B5EA8" stroke-width="2.4"/>
  <circle cx="38.5" cy="49" r="4" fill="#fff" stroke="#0B5EA8" stroke-width="2.4"/>
  <circle cx="51.5" cy="49" r="4" fill="#fff" stroke="#0B5EA8" stroke-width="2.4"/>
  <path d="M38.3 37.1 44.2 35.8M36.4 45.2 35.3 40M42.7 49h4.8" fill="none" stroke="#D9A13A" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M67 28c2.4 2.1 4.2 4.8 5.2 7.8" fill="none" stroke="#D9A13A" stroke-width="2.6" stroke-linecap="round"/>
</svg>
