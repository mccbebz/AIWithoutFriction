<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-labelledby="title desc">
  <title id="title">Identify hidden friction magnifier icon</title>
  <desc id="desc">Clean magnifying glass over connected friction points in Beacon and Sage blue.</desc>
  <defs>
    <radialGradient id="bg" cx="35%" cy="28%" r="72%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="62%" stop-color="#F7FBFE"/>
      <stop offset="100%" stop-color="#EAF4FB"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#071F4F" flood-opacity="0.10"/>
    </filter>
  </defs>

  <circle cx="48" cy="48" r="40" fill="url(#bg)" filter="url(#softShadow)"/>
  <circle cx="48" cy="48" r="39" fill="none" stroke="#B7CBE0" stroke-width="1.4"/>

  <circle cx="42" cy="42" r="18.5" fill="#FFFFFF" stroke="#071F4F" stroke-width="3.4"/>
  <path d="M55.6 55.6 72 72" fill="none" stroke="#071F4F" stroke-width="4.2" stroke-linecap="round"/>
  <path d="M35 38.5 44 35.5 51 42.5 43.5 50 34.5 47" fill="none" stroke="#9DB7D4" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="35" cy="38.5" r="3.7" fill="#FFFFFF" stroke="#0B5EA8" stroke-width="2.4"/>
  <circle cx="44" cy="35.5" r="3.7" fill="#FFFFFF" stroke="#0B5EA8" stroke-width="2.4"/>
  <circle cx="51" cy="42.5" r="3.7" fill="#FFFFFF" stroke="#0B5EA8" stroke-width="2.4"/>
  <circle cx="43.5" cy="50" r="3.7" fill="#FFFFFF" stroke="#0B5EA8" stroke-width="2.4"/>
  <circle cx="34.5" cy="47" r="3.7" fill="#FFFFFF" stroke="#0B5EA8" stroke-width="2.4"/>
</svg>
