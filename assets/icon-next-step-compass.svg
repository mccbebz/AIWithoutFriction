<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-labelledby="title desc">
  <title id="title">Define your next step compass icon</title>
  <desc id="desc">Compass navigation arrow with blue and gold accents.</desc>
  <defs>
    <radialGradient id="bg" cx="34%" cy="26%" r="72%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="62%" stop-color="#F4FAFE"/>
      <stop offset="100%" stop-color="#EAF4FB"/>
    </radialGradient>
    <linearGradient id="goldStroke" x1="20" y1="18" x2="78" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F0C56A"/>
      <stop offset="100%" stop-color="#D9A13A"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#071F4F" flood-opacity="0.12"/>
    </filter>
  </defs>

  <circle cx="48" cy="48" r="40" fill="url(#bg)" filter="url(#softShadow)"/>
  <circle cx="48" cy="48" r="39" fill="none" stroke="#9DB7D4" stroke-width="1.6"/>
  <path d="M20 72C31 82 47 86 62 80" fill="none" stroke="url(#goldStroke)" stroke-width="2.4" stroke-linecap="round" opacity=".9"/>

  <circle cx="48" cy="48" r="23" fill="none" stroke="#071F4F" stroke-width="3"/>
  <path d="M64 30.5 54.4 58.4 27.8 67.5 37.4 39.6 64 30.5Z" fill="#fff" stroke="#071F4F" stroke-width="3" stroke-linejoin="round"/>
  <path d="M64 30.5 45.6 49.2 27.8 67.5l9.6-27.9L64 30.5Z" fill="#EAF4FB" opacity=".9"/>
  <path d="M64 30.5 45.6 49.2" fill="none" stroke="#D9A13A" stroke-width="3.2" stroke-linecap="round"/>
  <circle cx="45.6" cy="49.2" r="4.2" fill="#071F4F"/>
  <path d="M29 28c3.6-3 8.1-5 13-5.6" fill="none" stroke="#D9A13A" stroke-width="2.6" stroke-linecap="round"/>
</svg>
