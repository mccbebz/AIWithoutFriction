<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-labelledby="title desc">
  <title id="title">Define your next step compass icon</title>
  <desc id="desc">Clean compass navigation arrow icon in Beacon and Sage blue.</desc>
  <defs>
    <radialGradient id="bg" cx="35%" cy="28%" r="72%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="62%" stop-color="#F7FBFE"/>
      <stop offset="100%" stop-color="#EAF4FB"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#071F4F" flood-opacity="0.10"/>
    </filter>
  </defs>

  <circle cx="48" cy="48" r="40" fill="url(#bg)" filter="url(#softShadow)"/>
  <circle cx="48" cy="48" r="39" fill="none" stroke="#B7CBE0" stroke-width="1.4"/>

  <circle cx="48" cy="48" r="23" fill="#FFFFFF" stroke="#071F4F" stroke-width="3.2"/>
  <path d="M65 30.5 55.5 58.5 27.5 68 37 40 65 30.5Z" fill="#FFFFFF" stroke="#071F4F" stroke-width="3" stroke-linejoin="round"/>
  <path d="M65 30.5 45.8 49.2 27.5 68 37 40 65 30.5Z" fill="#EAF4FB" opacity="0.95"/>
  <path d="M65 30.5 45.8 49.2" fill="none" stroke="#0B5EA8" stroke-width="3.2" stroke-linecap="round"/>
  <circle cx="45.8" cy="49.2" r="4.2" fill="#071F4F"/>
  <path d="M48 19v5M48 72v5M19 48h5M72 48h5" fill="none" stroke="#9DB7D4" stroke-width="2.4" stroke-linecap="round"/>
</svg>
